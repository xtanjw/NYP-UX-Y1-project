   <div id="form-area" class="form-container">
      <form id="feedback-form">
         <div class="form-group">
            <label for="Email">Email address</label>
            <input id="Email" type="email" class="form-control form-control-lg" placeholder="name@example.com" required>
         </div>

         <div class="form-group">
            <label for="Issue">Please Select an Option</label>
            <select id="Issue" class="form-control form-control-lg" required>
               <option selected disabled value="">Please select an option</option>
               <option value="Website Issues">Website Issues</option>
               <option value="Suggestions">Suggestions</option>
               <option value="Others">Others</option>
            </select>
         </div>

         <div class="form-group">
            <label for="TextArea">Feedback</label>
            <textarea id="TextArea" class="form-control form-control-lg" rows="3" placeholder="Please enter feedback"
               required></textarea>
         </div>

         <div class="text-center mt-3">
            <button type="submit" class="btn btn-light">Submit</button>
            <!--Event listener-->
            <script>document.getElementById("feedback-form").addEventListener("submit", function (event) { event.preventDefault(); formSubmit(); });</script>
         </div>
      </form>
